name: Testes

# A cada push roda a suíte automática do Godot em headless (testes/rodar_todos.gd) e, se der, gera
# capturas de tela (xvfb) e o APK debug do Android como artefatos. Nenhum segredo é usado: o keystore de
# debug é criado na hora e não vai para o repositório.
on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  testes:
    name: Suíte de testes (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version
      - name: Importar o projeto
        run: godot --headless --path . --import || true
      - name: Rodar todos os testes
        run: godot --headless --path . --script res://testes/rodar_todos.gd

  capturas:
    name: Capturas de tela (xvfb)
    runs-on: ubuntu-latest
    needs: testes
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o Godot e o xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64 || sudo apt-get install -y xvfb libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Importar e capturar
        run: |
          godot --headless --path . --import || true
          xvfb-run -a -s "-screen 0 1500x700x24" godot --path . --rendering-driver opengl3 --script res://testes/capturar_todas.gd
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: testes/capturas/*.png

  apk:
    name: APK debug (Android)
    runs-on: ubuntu-latest
    needs: testes
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar o Godot e os templates de exportação
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q tpl.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Configurar o Android e criar um keystore de DEBUG (não vai para o repositório)
        run: |
          keytool -genkeypair -v -keystore "$PWD/debug.keystore" -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Exportar o APK debug
        run: |
          godot --headless --path . --import || true
          mkdir -p build/android
          godot --headless --path . --export-debug "Android (APK, arm64)" build/android/Returing-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: returing-debug-apk
          path: build/android/Returing-debug.apk
